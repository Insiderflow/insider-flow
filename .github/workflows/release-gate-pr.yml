name: Release Gate PR

on:
  pull_request:
    branches:
      - "**"

jobs:
  release-gate-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release gate (local profile)
        env:
          RELEASE_CHECK_SKIP_FRONTEND: "1"
        run: npm run release:check:ci

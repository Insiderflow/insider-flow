# SEC Form 4 → Neon (OpenInsider* tables). Lower latency than scraping openinsider.com alone.
name: EDGAR Form 4 sync

on:
  schedule:
    # Every 2 hours (UTC). SEC courtesy + edgartools volume; use workflow_dispatch for catch-up.
    - cron: '25 */2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to export (UTC, inclusive of today)'
        required: false
        default: '2'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/edgar-form4-sync.yml'
      - 'web/scripts/edgar_form4_backfill.js'
      - 'web/scripts/edgar_form4_export.py'
      - 'web/scripts/import_openinsider_filing_csv.js'
      - 'web/requirements-edgar.txt'

concurrency:
  group: edgar-form4-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: web/requirements-edgar.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps (edgartools)
        run: pip install -r requirements-edgar.txt

      - name: Install Node deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Assert secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY || secrets.SEC_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
          if [ -z "${EDGAR_IDENTITY:-}" ]; then
            echo "::error::Set EDGAR_IDENTITY (or SEC_IDENTITY) to your SEC user-agent email — required by SEC fair access."
            exit 1
          fi

      - name: Export + import Form 4 (last N days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY || secrets.SEC_IDENTITY }}
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          node scripts/edgar_form4_backfill.js --days "$DAYS" --chunk-days 1 --sleep-ms 60

name: Release Gate Prod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release-gate-strict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      INTERNAL_JOBS_SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
      REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      RELEASE_CHECK_BASE_URL: ${{ secrets.RELEASE_CHECK_BASE_URL }}
      RELEASE_CHECK_SKIP_FRONTEND: "1"
      # Set repo variable RELEASE_CHECK_SKIP_REVENUECAT=1 until RevenueCat backend secrets + webhooks exist.
      RELEASE_CHECK_SKIP_REVENUECAT: ${{ vars.RELEASE_CHECK_SKIP_REVENUECAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release gate (strict)
        run: npm run release:check:prod

  frontend-release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindful-trade-signal-flow
    env:
      _SECRET_VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_REVENUECAT_API_KEY_IOS: ${{ secrets.VITE_REVENUECAT_API_KEY_IOS }}
      VITE_REVENUECAT_API_KEY_ANDROID: ${{ secrets.VITE_REVENUECAT_API_KEY_ANDROID }}
      VITE_REVENUECAT_OFFERING_ID: ${{ secrets.VITE_REVENUECAT_OFFERING_ID }}
      VITE_REVENUECAT_ENTITLEMENT_ID: ${{ secrets.VITE_REVENUECAT_ENTITLEMENT_ID }}
      REQUIRE_REVENUECAT_SECRETS: ${{ vars.REQUIRE_REVENUECAT_SECRETS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mindful-trade-signal-flow/package-lock.json

      - name: Resolve VITE_API_BASE_URL (secret or prod default)
        run: |
          set -euo pipefail
          if [ -n "${_SECRET_VITE_API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL=${_SECRET_VITE_API_BASE_URL}" >> "$GITHUB_ENV"
          else
            echo "VITE_API_BASE_URL=https://www.insiderflow.asia" >> "$GITHUB_ENV"
            echo "::notice::VITE_API_BASE_URL secret unset — using https://www.insiderflow.asia for CI. Add repo secret VITE_API_BASE_URL if the Vite app must target another host."
          fi

      - name: Validate RevenueCat secrets (optional strict)
        run: |
          revenuecat_vars=(
            VITE_REVENUECAT_API_KEY_IOS
            VITE_REVENUECAT_API_KEY_ANDROID
            VITE_REVENUECAT_OFFERING_ID
            VITE_REVENUECAT_ENTITLEMENT_ID
          )
          strict_mode="${REQUIRE_REVENUECAT_SECRETS:-0}"
          missing_revenuecat=0
          for v in "${revenuecat_vars[@]}"; do
            if [ -z "${!v}" ]; then
              if [ "$strict_mode" = "1" ]; then
                echo "Missing required frontend secret (strict mobile mode): $v"
              else
                echo "WARN: RevenueCat secret not set yet: $v"
              fi
              missing_revenuecat=1
            fi
          done
          if [ "$missing_revenuecat" -eq 1 ] && [ "$strict_mode" = "1" ]; then
            exit 1
          fi
          if [ "$missing_revenuecat" -eq 1 ] && [ "$strict_mode" != "1" ]; then
            echo "WARN: RevenueCat mobile config is incomplete. Web-only releases are still allowed."
            echo "INFO: Set repo variable REQUIRE_REVENUECAT_SECRETS=1 to enforce strict mobile billing secrets."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

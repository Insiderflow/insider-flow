name: Pre-calculate Portfolio Data

on:
  schedule:
    # Run daily at 2 AM UTC (10 AM HKT) to update portfolio cache with latest data
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/precalculate-portfolio.yml'
      - 'web/scripts/precalculate-portfolio-data.js'

concurrency:
  group: precalculate-portfolio
  cancel-in-progress: true

jobs:
  precalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma client
      run: npx prisma generate

    - name: Pre-calculate Portfolio Data
      run: node scripts/precalculate-portfolio-data.js
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Upload portfolio cache artifact
      uses: actions/upload-artifact@v4
      with:
        name: portfolio-cache
        path: web/portfolio_cache.json
        if-no-files-found: error

    - name: Send failure alert webhook (optional)
      if: failure()
      env:
        CI_ALERT_WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK_URL }}
      run: |
        if [ -z "$CI_ALERT_WEBHOOK_URL" ]; then
          echo "No CI_ALERT_WEBHOOK_URL configured; skipping external alert."
          exit 0
        fi
        curl -X POST "$CI_ALERT_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"Portfolio precalculate failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"


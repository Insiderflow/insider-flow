name: Pre-calculate Portfolio Data

on:
  schedule:
    # Run daily at 2 AM UTC (10 AM HKT) to update portfolio cache with latest data
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/precalculate-portfolio.yml'
      - 'web/scripts/precalculate-portfolio-data.js'

jobs:
  precalculate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma client
      run: npx prisma generate

    - name: Pre-calculate Portfolio Data
      run: node scripts/precalculate-portfolio-data.js
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Upload portfolio cache artifact
      uses: actions/upload-artifact@v4
      with:
        name: portfolio-cache
        path: web/portfolio_cache.json
        if-no-files-found: error


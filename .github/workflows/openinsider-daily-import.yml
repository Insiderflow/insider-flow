# Corporate OpenInsider → Prisma (openInsider_* tables). Powers 內部交易 /insider.
name: OpenInsider daily import

on:
  schedule:
    # HKT 9:30pm / 10:30pm / 1:30am (20m after Capitol scrape slots)
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openinsider-daily-import.yml'
      - '.github/workflows/daily-scrape.yml'
      - 'web/scripts/openinsider_ci_sync.js'
      - 'web/scripts/sync_published_day.js'
      - 'web/scripts/openinsider_backfill_filing_days.js'
      - 'web/scripts/openinsider_daily_import.js'
      - 'web/scripts/lib/openinsider_*.js'
      - 'web/package.json'

concurrency:
  group: openinsider-daily-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Assert DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL Actions secret is missing (same Neon URL as Render)."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run OpenInsider CI sync (screener + latest lists)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENINSIDER_CI_LOOKBACK_DAYS: '3'
          OPENINSIDER_CI_MAX_STALE_HOURS: '48'
        run: node scripts/openinsider_ci_sync.js

      - name: OpenInsider freshness guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_OPENINSIDER_STALENESS_DAYS: '3'
        run: node scripts/check_openinsider_freshness.js

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openinsider-import-artifacts
          path: web/.artifacts/openinsider-import-report.json
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          if [ -f ".artifacts/openinsider-import-report.json" ]; then
            node -e '
              const fs=require("fs");
              const r=JSON.parse(fs.readFileSync(".artifacts/openinsider-import-report.json","utf8"));
              const lines=[
                "## OpenInsider import",
                "",
                `- Imported: **${r.imported ?? 0}** (skipped dup: ${r.skippedDup ?? 0})`,
                `- Latest filing: \`${r.dbLatestFiling ?? "n/a"}\``,
                `- Stale hours: \`${r.staleHours ?? "n/a"}\``,
                `- Days: ${(r.targetDays||[]).join(", ")}`,
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n")+"\n");
            '
          fi

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[CI] OpenInsider daily import failure";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Scheduled OpenInsider sync failed (內部交易 data).",
              "",
              `- Run: ${runUrl}`,
              "",
              "Check artifact **openinsider-import-artifacts** and Playwright reachability to openinsider.com.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-failure,openinsider",
              per_page: 50,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci-failure", "openinsider"],
              });
            }

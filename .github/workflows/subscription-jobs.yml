name: Subscription Internal Jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Optional provider scope (all|stripe|revenuecat)"
        required: false
        default: "all"
      replay_limit:
        description: "Auto-retry replay limit (1-50)"
        required: false
        default: "20"
      run_alerts:
        description: "Run alert evaluation/dispatch (true|false)"
        required: false
        default: "true"

concurrency:
  group: subscription-internal-jobs
  cancel-in-progress: false

jobs:
  auto-retry:
    runs-on: ubuntu-latest
    env:
      INTERNAL_JOBS_BASE_URL: ${{ secrets.INTERNAL_JOBS_BASE_URL }}
      INTERNAL_JOBS_SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}
      INPUT_PROVIDER: ${{ github.event.inputs.provider || 'all' }}
      INPUT_REPLAY_LIMIT: ${{ github.event.inputs.replay_limit || '20' }}
    steps:
      - name: Validate secrets
        run: |
          test -n "$INTERNAL_JOBS_BASE_URL" || (echo "Missing INTERNAL_JOBS_BASE_URL secret" && exit 1)
          test -n "$INTERNAL_JOBS_SECRET" || (echo "Missing INTERNAL_JOBS_SECRET secret" && exit 1)

      - name: Call subscription auto-retry endpoint
        run: |
          PROVIDER_PAYLOAD=""
          if [ "$INPUT_PROVIDER" = "stripe" ] || [ "$INPUT_PROVIDER" = "revenuecat" ]; then
            PROVIDER_PAYLOAD="\"provider\":\"$INPUT_PROVIDER\","
          fi
          BODY="{${PROVIDER_PAYLOAD}\"limit\":$INPUT_REPLAY_LIMIT}"
          echo "POST /api/internal/jobs/subscription-events $BODY"
          curl --fail-with-body -sS -X POST \
            "$INTERNAL_JOBS_BASE_URL/api/internal/jobs/subscription-events" \
            -H "content-type: application/json" \
            -H "authorization: Bearer $INTERNAL_JOBS_SECRET" \
            -d "$BODY"
          echo

  alerts:
    runs-on: ubuntu-latest
    needs: auto-retry
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_alerts != 'false' }}
    env:
      INTERNAL_JOBS_BASE_URL: ${{ secrets.INTERNAL_JOBS_BASE_URL }}
      INTERNAL_JOBS_SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}
      INPUT_PROVIDER: ${{ github.event.inputs.provider || 'all' }}
    steps:
      - name: Validate secrets
        run: |
          test -n "$INTERNAL_JOBS_BASE_URL" || (echo "Missing INTERNAL_JOBS_BASE_URL secret" && exit 1)
          test -n "$INTERNAL_JOBS_SECRET" || (echo "Missing INTERNAL_JOBS_SECRET secret" && exit 1)

      - name: Call subscription alert endpoint
        run: |
          PROVIDER_PAYLOAD=""
          if [ "$INPUT_PROVIDER" = "stripe" ] || [ "$INPUT_PROVIDER" = "revenuecat" ]; then
            PROVIDER_PAYLOAD="\"provider\":\"$INPUT_PROVIDER\""
          fi
          BODY="{}"
          if [ -n "$PROVIDER_PAYLOAD" ]; then
            BODY="{${PROVIDER_PAYLOAD}}"
          fi
          echo "POST /api/internal/jobs/subscription-events/alerts $BODY"
          curl --fail-with-body -sS -X POST \
            "$INTERNAL_JOBS_BASE_URL/api/internal/jobs/subscription-events/alerts" \
            -H "content-type: application/json" \
            -H "authorization: Bearer $INTERNAL_JOBS_SECRET" \
            -d "$BODY"
          echo

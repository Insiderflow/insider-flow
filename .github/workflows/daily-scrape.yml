name: Daily Data Scrape

on:
  schedule:
    # Run at 9pm, 10pm, and 1am HKT (Hong Kong Time)
    # 9pm HKT = 1pm UTC, 10pm HKT = 2pm UTC, 1am HKT = 5pm UTC (previous day)
    - cron: '0 13 * * *'  # 9pm HKT
    - cron: '0 14 * * *'  # 10pm HKT  
    - cron: '0 17 * * *'  # 1am HKT
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas pyyaml retry tqdm || true
        
    - name: Install dependencies
      run: |
        npm ci

    - name: Install Playwright browsers and system dependencies
      run: |
        npx playwright install --with-deps
    
    - name: Run OpenInsider scraper
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "📊 Running OpenInsider scraper..."
        # Try multiple paths since we don't know exact repo structure
        if [ -f "../../openinsiderData/openinsider_scraper.py" ]; then
          cd ../../openinsiderData
          python3 openinsider_scraper.py || echo "⚠️ OpenInsider scraper failed, continuing..."
        elif [ -f "../openinsiderData/openinsider_scraper.py" ]; then
          cd ../openinsiderData
          python3 openinsider_scraper.py || echo "⚠️ OpenInsider scraper failed, continuing..."
        elif [ -f "openinsiderData/openinsider_scraper.py" ]; then
          cd openinsiderData
          python3 openinsider_scraper.py || echo "⚠️ OpenInsider scraper failed, continuing..."
        else
          echo "⚠️ OpenInsider scraper not found in expected locations, skipping..."
          echo "   Searched: ../../openinsiderData, ../openinsiderData, ./openinsiderData"
        fi
        
    - name: Run daily scrape (Capitol Trades)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        node scripts/daily-scrape.js
        
    - name: Notify on success
      if: success()
      run: echo "✅ Daily scrape completed successfully"
      
    - name: Notify on failure
      if: failure()
      run: echo "❌ Daily scrape failed"

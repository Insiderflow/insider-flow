name: Daily Data Scrape

on:
  schedule:
    # Run at 9pm, 10pm, and 1am HKT (Hong Kong Time)
    # 9pm HKT = 1pm UTC, 10pm HKT = 2pm UTC, 1am HKT = 5pm UTC (previous day)
    - cron: '0 13 * * *'  # 9pm HKT
    - cron: '0 14 * * *'  # 10pm HKT  
    - cron: '0 17 * * *'  # 1am HKT
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # Disable caching to avoid stale node_modules across runs
        
    - name: Install dependencies
      run: |
        npm ci

    - name: Install Playwright npm package
      run: |
        npm i playwright@^1

    - name: Install Playwright browsers and system dependencies
      run: |
        npx playwright install --with-deps

    - name: Verify Playwright is installed
      run: |
        npm ls playwright || true
        node -e "console.log('playwright path:', require.resolve('playwright'))"
        ls -la node_modules/playwright || true
        
    - name: Run daily scrape
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        node scripts/daily-scrape.js
        
    - name: Notify on success
      if: success()
      run: echo "✅ Daily scrape completed successfully"
      
    - name: Notify on failure
      if: failure()
      run: echo "❌ Daily scrape failed"

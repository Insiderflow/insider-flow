name: Daily Data Scrape

on:
  schedule:
    # Run at 9pm, 10pm, and 1am HKT (Hong Kong Time)
    # 9pm HKT = 1pm UTC, 10pm HKT = 2pm UTC, 1am HKT = 5pm UTC (previous day)
    - cron: '0 13 * * *'  # 9pm HKT
    - cron: '0 14 * * *'  # 10pm HKT  
    - cron: '0 17 * * *'  # 1am HKT
  workflow_dispatch: # Allow manual trigger

# If another Daily Data Scrape starts while this run is still going (manual + cron, or double Run),
# cancel-in-progress aborts the older run — logs end with "Error: The operation was canceled".
concurrency:
  group: daily-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas pyyaml retry tqdm
        
    - name: Install dependencies
      run: |
        npm ci

    - name: Prisma generate
      run: npx prisma generate

    - name: Assert DATABASE_URL (Capitol import)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -z "$DATABASE_URL" ]; then
          echo "::error::Repository secret DATABASE_URL is empty or missing. Settings → Secrets and variables → Actions → DATABASE_URL (same Neon URL as Render)."
          exit 1
        fi

    # Chromium only. Skip --with-deps: ubuntu-latest already has enough libs for headless Capitol
    # scrapes; --with-deps pulls 100+ apt packages as root and is slow / easy to confuse with hangs.
    # If a run fails with a missing .so, restore: npx playwright install --with-deps chromium
    - name: Install Playwright (Chromium browser only)
      run: npx playwright install chromium

    - name: Restore import streak state
      uses: actions/cache/restore@v4
      with:
        path: web/.ci-state
        key: daily-scrape-streak-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          daily-scrape-streak-${{ github.ref_name }}-
    
    - name: Run legacy OpenInsider Python scraper (optional)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "📊 Optional legacy Python OpenInsider scraper (repo-specific)..."
        SCRAPER_PATH=""
        if [ -f "../../openinsiderData/openinsider_scraper.py" ]; then
          SCRAPER_PATH="../../openinsiderData/openinsider_scraper.py"
        elif [ -f "../openinsiderData/openinsider_scraper.py" ]; then
          SCRAPER_PATH="../openinsiderData/openinsider_scraper.py"
        elif [ -f "openinsiderData/openinsider_scraper.py" ]; then
          SCRAPER_PATH="openinsiderData/openinsider_scraper.py"
        fi

        if [ -z "$SCRAPER_PATH" ]; then
          echo "⚠️ OpenInsider scraper not found in expected locations; skipping OpenInsider step."
          echo "   Searched: ../../openinsiderData/openinsider_scraper.py, ../openinsiderData/openinsider_scraper.py, openinsiderData/openinsider_scraper.py"
          exit 0
        fi

        python3 "$SCRAPER_PATH"

    # Corporate /insider page data: Node Playwright importer runs inside daily-scrape.js after Capitol import (non-fatal if it fails).

    - name: Run daily scrape (Capitol Trades)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Keep CI fast and memory-safe: corporate OpenInsider is optional; Capitol must not depend on it.
        OPENINSIDER_IMPORT_DISABLED: '1'
      run: |
        node scripts/daily-scrape.js

    # Advisory only: thresholds lag real-world Capitol disclosure delays; do not fail the job.
    - name: Data freshness guard
      continue-on-error: true
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        MAX_TRADE_STALENESS_DAYS: 21
        MAX_PUBLISH_STALENESS_HOURS: 168
      run: |
        node scripts/check_data_freshness.js

    # Optional: non-blocking. Corporate OpenInsider is separate from Capitol Trade freshness.
    - name: OpenInsider freshness (non-blocking)
      continue-on-error: true
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        MAX_OPENINSIDER_STALENESS_DAYS: 21
      run: |
        node scripts/check_openinsider_freshness.js

    # Uses last-capital-import.json (imported+updated) so disclosure-only runs do not false-trigger.
    - name: Zero-import streak guard
      if: success()
      continue-on-error: true
      env:
        ZERO_IMPORT_STREAK_FAIL_AFTER: 10
      run: |
        node scripts/import_streak_guard.js

    - name: Upload scrape artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-scrape-artifacts
        path: |
          web/.artifacts/**
          web/.ci-state/**
        if-no-files-found: warn

    - name: Write scrape run summary
      if: always()
      run: |
        if [ ! -f ".artifacts/daily-scrape-report.json" ]; then
          echo "## Daily Scrape Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No scrape report generated." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        node -e 'const fs=require("fs");const p=".artifacts/daily-scrape-report.json";const r=JSON.parse(fs.readFileSync(p,"utf8"));const lines=[];lines.push("## Daily Scrape Summary");lines.push("");lines.push(`- Status: \`${r.status}\``);lines.push(`- Source: \`${r.source||"n/a"}\``);lines.push(`- File: \`${r.selectedFile?require("path").basename(r.selectedFile):"n/a"}\``);lines.push(`- Imported Delta: \`${r.database?.importedDelta ?? "n/a"}\``);lines.push(`- Latest Trade Date: \`${r.database?.latestTradeDate ?? "n/a"}\``);if(r.validation){lines.push(`- Primary Valid Ratio: \`${(r.validation.validRatio*100).toFixed(1)}%\``);}if(r.fallbackValidation){lines.push(`- Fallback Valid Ratio: \`${(r.fallbackValidation.validRatio*100).toFixed(1)}%\``);}if(r.error){lines.push(`- Error: \`${r.error}\``);}const gp=".artifacts/import-streak-report.json";if(fs.existsSync(gp)){const g=JSON.parse(fs.readFileSync(gp,"utf8"));lines.push(`- Zero-Import Streak: \`${g.zeroImportStreak}\` (threshold \`${g.threshold}\`)`);lines.push(`- Streak Guard: \`${g.ok ? "pass" : "fail"}\``);}fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'

    - name: Save import streak state
      if: always()
      uses: actions/cache/save@v4
      with:
        path: web/.ci-state
        key: daily-scrape-streak-${{ github.ref_name }}-${{ github.run_id }}
        
    - name: Notify on success
      if: success()
      run: echo "✅ Daily scrape completed successfully"
      
    - name: Notify on failure
      if: failure()
      run: echo "❌ Daily scrape failed"

    - name: Send failure alert webhook (optional)
      if: failure()
      env:
        CI_ALERT_WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK_URL }}
      run: |
        if [ -z "$CI_ALERT_WEBHOOK_URL" ]; then
          echo "No CI_ALERT_WEBHOOK_URL configured; skipping external alert."
          exit 0
        fi
        curl -X POST "$CI_ALERT_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"Daily scrape failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

    - name: Create or update GitHub failure issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = "[CI] Daily scrape failure";
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const body = [
            "Scheduled daily scrape failed.",
            "",
            `- Workflow: ${process.env.GITHUB_WORKFLOW}`,
            `- Branch: ${process.env.GITHUB_REF_NAME}`,
            `- Run: ${runUrl}`,
            `- Commit: ${process.env.GITHUB_SHA}`,
            "",
            "_This issue is auto-managed by CI._"
          ].join("\n");

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: "open",
            labels: "ci-failure,daily-scrape",
            per_page: 100
          });

          const existing = issues.find((i) => i.title === title);
          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ci-failure", "daily-scrape"]
            });
          }

name: Daily Data Scrape

on:
  schedule:
    # Run at 9pm, 10pm, and 1am HKT (Hong Kong Time)
    # 9pm HKT = 1pm UTC, 10pm HKT = 2pm UTC, 1am HKT = 5pm UTC (previous day)
    - cron: '0 13 * * *'  # 9pm HKT
    - cron: '0 14 * * *'  # 10pm HKT  
    - cron: '0 17 * * *'  # 1am HKT
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: daily-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas pyyaml retry tqdm
        
    - name: Install dependencies
      run: |
        npm ci

    - name: Install Playwright browsers and system dependencies
      run: |
        npx playwright install --with-deps
    
    - name: Run OpenInsider scraper
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "📊 Running OpenInsider scraper..."
        SCRAPER_PATH=""
        if [ -f "../../openinsiderData/openinsider_scraper.py" ]; then
          SCRAPER_PATH="../../openinsiderData/openinsider_scraper.py"
        elif [ -f "../openinsiderData/openinsider_scraper.py" ]; then
          SCRAPER_PATH="../openinsiderData/openinsider_scraper.py"
        elif [ -f "openinsiderData/openinsider_scraper.py" ]; then
          SCRAPER_PATH="openinsiderData/openinsider_scraper.py"
        fi

        if [ -z "$SCRAPER_PATH" ]; then
          echo "❌ OpenInsider scraper not found in expected locations"
          echo "   Searched: ../../openinsiderData/openinsider_scraper.py, ../openinsiderData/openinsider_scraper.py, openinsiderData/openinsider_scraper.py"
          exit 1
        fi

        python3 "$SCRAPER_PATH"
        
    - name: Run daily scrape (Capitol Trades)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        node scripts/daily-scrape.js
        
    - name: Notify on success
      if: success()
      run: echo "✅ Daily scrape completed successfully"
      
    - name: Notify on failure
      if: failure()
      run: echo "❌ Daily scrape failed"

    - name: Send failure alert webhook (optional)
      if: failure()
      env:
        CI_ALERT_WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK_URL }}
      run: |
        if [ -z "$CI_ALERT_WEBHOOK_URL" ]; then
          echo "No CI_ALERT_WEBHOOK_URL configured; skipping external alert."
          exit 0
        fi
        curl -X POST "$CI_ALERT_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"Daily scrape failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

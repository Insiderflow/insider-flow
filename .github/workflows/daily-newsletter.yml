# Re-run failed jobs reuses the OLD commit (no new checkout of main). If a run failed before
# a dependency fix landed, use "Run workflow" on main instead of Re-run, or push a no-op commit.
name: Daily Newsletter

on:
  schedule:
    # Run daily at 9am HKT (1am UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-newsletter.yml'
      - 'web/scripts/send-daily-newsletter.js'
      - 'web/scripts/lib/hkt-day-window.js'
      - 'web/scripts/check-newsletter-status.js'
      - 'web/prisma/schema.prisma'
      - 'web/prisma/migrations/**'
      - 'web/package.json'
      - 'web/package-lock.json'

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Assert newsletter secrets (DATABASE_URL + SENDGRID_API_KEY)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      run: |
        set -euo pipefail
        ok=1
        if [ -z "${DATABASE_URL:-}" ]; then
          echo "::error::Repository secret DATABASE_URL is missing. Settings → Secrets and variables → Actions → DATABASE_URL (Neon pooler URL)."
          ok=0
        fi
        if [ -z "${SENDGRID_API_KEY:-}" ]; then
          echo "::error::Repository secret SENDGRID_API_KEY is missing. SendGrid → API Keys → Mail Send → add secret here. Without it the newsletter job cannot send (and will fail by design)."
          ok=0
        fi
        if [ "$ok" != "1" ]; then exit 1; fi
        echo "Newsletter required secrets are set."
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci

    - name: Verify SendGrid dependency (clear signal if Re-run used an old commit)
      run: node -e "require('@sendgrid/mail'); console.log('@sendgrid/mail ok')"
      
    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Apply database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        
    - name: Send Daily Newsletter
      run: node scripts/send-daily-newsletter.js
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL || secrets.NEWSLETTER_FROM_EMAIL || 'team@insiderflow.asia' }}
        NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'https://insiderflow.asia' }}
        NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL || secrets.SENDGRID_FROM_EMAIL || 'team@insiderflow.asia' }}
        NEWSLETTER_FROM_NAME: ${{ secrets.NEWSLETTER_FROM_NAME || 'Insider Flow' }}
        NEWSLETTER_CTA_URL: ${{ secrets.NEWSLETTER_CTA_URL || 'https://insiderflow.asia' }}

